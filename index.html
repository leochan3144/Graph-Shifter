<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph Transformations Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Add KaTeX for textbook-style math rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '\\(', right: '\\)', display: false}]});"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto space-y-6">
        <header class="text-center space-y-2">
            <h1 class="text-3xl font-bold text-indigo-700">Graph Transformations Explorer</h1>
            <p class="text-slate-600 max-w-2xl mx-auto text-lg">
                Explore how the parameters \(a\), \(b\), \(h\), and \(k\) affect the graph of a function in the form:
            </p>
            <div class="text-xl text-indigo-900 my-4 bg-slate-200 inline-block px-6 py-3 rounded-lg shadow-inner">
                $$ y = a \cdot f(b(x + h)) + k $$
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <div class="lg:col-span-2 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <div class="relative h-[400px] md:h-[500px] w-full">
                    <canvas id="graphCanvas"></canvas>
                </div>
                
                <!-- Dynamic Equation Display -->
                <div id="dynamicEquationContainer" class="text-2xl font-semibold text-indigo-700 h-16 flex items-center justify-center overflow-hidden mt-4 border-t border-slate-100 pt-6">
                    <span id="dynamicEquation"></span>
                </div>
            </div>

            <div class="space-y-6">
                
                <!-- Controls -->
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-4">
                    <h2 class="text-xl font-semibold text-slate-800 border-b pb-2">Controls</h2>
                    
                    <!-- Reference Points Table -->
                    <div class="pb-4 border-b border-slate-200">
                        <h3 class="text-md font-semibold text-slate-800 mb-3">Reference Points Mapping</h3>
                        <div class="overflow-x-auto rounded border border-slate-200">
                            <table class="w-full text-sm text-left text-slate-600 bg-white">
                                <thead class="text-xs text-slate-700 bg-slate-50 border-b border-slate-200">
                                    <tr>
                                        <th scope="col" class="px-3 py-2 border-r border-slate-200 text-center">Original \((x, y)\)</th>
                                        <th scope="col" class="px-3 py-2 border-r border-slate-200 text-center">Mapping Process</th>
                                        <th scope="col" class="px-3 py-2 text-center">Transformed \((x', y')\)</th>
                                    </tr>
                                </thead>
                                <tbody id="refPointsTableBody">
                                    <!-- Dynamic rows populated by JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Base Function, f(x)</label>
                        <select id="baseFunction" class="w-full border border-slate-300 rounded-md p-2 focus:ring-indigo-500 focus:border-indigo-500">
                            <option value="quadratic">Quadratic: f(x) = x²</option>
                            <option value="cubic">Cubic: f(x) = x³</option>
                            <option value="absolute">Absolute Value: f(x) = |x|</option>
                            <option value="sine">Sine: f(x) = sin(x)</option>
                        </select>
                    </div>

                    <!-- a Parameter -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="text-sm font-medium text-slate-700" title="Vertical Stretch/Compression">\(a\) (Vertical Stretch/Compression)</label>
                            <input type="number" id="num-a" value="1" step="0.1" min="0" class="w-16 border border-slate-300 rounded text-center text-sm p-1">
                        </div>
                        <input type="range" id="slider-a" min="0" max="5" step="0.1" value="1" class="w-full accent-indigo-600">
                        <div class="mt-2 flex items-center">
                            <input type="checkbox" id="check-reflect-x" class="w-4 h-4 text-indigo-600 border-slate-300 rounded focus:ring-indigo-500">
                            <label for="check-reflect-x" class="ml-2 text-sm text-slate-700">Reflect across x-axis</label>
                        </div>
                    </div>

                    <!-- b Parameter -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="text-sm font-medium text-slate-700" title="Horizontal Stretch/Compression">\(b\) (Horizontal Stretch/Compression)</label>
                            <input type="number" id="num-b" value="1" step="0.1" min="0" class="w-16 border border-slate-300 rounded text-center text-sm p-1">
                        </div>
                        <input type="range" id="slider-b" min="0" max="5" step="0.1" value="1" class="w-full accent-emerald-600">
                        <div class="mt-2 flex items-center">
                            <input type="checkbox" id="check-reflect-y" class="w-4 h-4 text-emerald-600 border-slate-300 rounded focus:ring-emerald-500">
                            <label for="check-reflect-y" class="ml-2 text-sm text-slate-700">Reflect across y-axis</label>
                        </div>
                    </div>

                    <!-- h Parameter -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="text-sm font-medium text-slate-700" title="Horizontal Translation">\(h\) (Horizontal Translation)</label>
                            <input type="number" id="num-h" value="0" step="0.5" class="w-16 border border-slate-300 rounded text-center text-sm p-1">
                        </div>
                        <input type="range" id="slider-h" min="-10" max="10" step="0.5" value="0" class="w-full accent-amber-500">
                    </div>

                    <!-- k Parameter -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="text-sm font-medium text-slate-700" title="Vertical Translation">\(k\) (Vertical Translation)</label>
                            <input type="number" id="num-k" value="0" step="0.5" class="w-16 border border-slate-300 rounded text-center text-sm p-1">
                        </div>
                        <input type="range" id="slider-k" min="-10" max="10" step="0.5" value="0" class="w-full accent-rose-500">
                    </div>
                    
                    <button id="resetBtn" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 py-2 rounded-md transition-colors text-sm font-medium">Reset to Default</button>
                </div>

                <!-- Summary -->
                <div class="bg-indigo-50 p-5 rounded-xl shadow-sm border border-indigo-100">
                    <h2 class="text-lg font-semibold text-indigo-900 mb-3">Transformations Summary</h2>
                    <ul id="summaryList" class="list-disc list-inside text-sm text-indigo-800 space-y-1.5">
                        <!-- Dynamic content populated by JS -->
                    </ul>
                </div>

            </div>
        </div>
    </div>

    <script>
        // State variables
        let params = { a: 1, b: 1, h: 0, k: 0, reflectX: false, reflectY: false };
        const refPointsX = [-2, -1, 0, 1, 2];
        let baseType = 'quadratic';
        let chartInstance = null;

        // Base mathematical functions
        const functions = {
            quadratic: (x) => x * x,
            cubic: (x) => x * x * x,
            absolute: (x) => Math.abs(x),
            sine: (x) => Math.sin(x)
        };

        // Initialize Chart.js
        function initChart() {
            const ctx = document.getElementById('graphCanvas').getContext('2d');
            
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: 'Original f(x)',
                            data: [],
                            borderColor: 'rgba(148, 163, 184, 0.6)', // Slate 400 dashed
                            borderWidth: 2,
                            borderDash: [5, 5],
                            pointRadius: 0,
                            tension: 0.1
                        },
                        {
                            label: 'Transformed y = a · f(b(x - h)) + k',
                            data: [],
                            borderColor: 'rgba(79, 70, 229, 1)', // Indigo 600
                            borderWidth: 3,
                            pointRadius: 0,
                            tension: 0.1
                        },
                        {
                            type: 'scatter',
                            label: 'Original Points',
                            data: [],
                            backgroundColor: 'rgba(100, 116, 139, 1)', // Slate 500
                            borderColor: '#ffffff',
                            borderWidth: 2,
                            pointRadius: 6,
                            pointHoverRadius: 6
                        },
                        {
                            type: 'scatter',
                            label: 'Transformed Points',
                            data: [],
                            backgroundColor: 'rgba(217, 70, 239, 1)', // Fuchsia 500
                            borderColor: '#ffffff',
                            borderWidth: 2,
                            pointRadius: 6,
                            pointHoverRadius: 6
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 0 }, // Disable animation for smooth sliding
                    scales: {
                        x: {
                            type: 'linear',
                            position: 'bottom',
                            min: -10,
                            max: 10,
                            grid: { color: (ctx) => ctx.tick.value === 0 ? '#64748b' : '#e2e8f0', lineWidth: (ctx) => ctx.tick.value === 0 ? 2 : 1 }
                        },
                        y: {
                            type: 'linear',
                            min: -10,
                            max: 10,
                            grid: { color: (ctx) => ctx.tick.value === 0 ? '#64748b' : '#e2e8f0', lineWidth: (ctx) => ctx.tick.value === 0 ? 2 : 1 }
                        }
                    },
                    plugins: {
                        tooltip: { enabled: false } // Disable tooltips for cleaner interaction
                    }
                }
            });
            updateGraph();
        }

        // Calculate and update chart data
        function updateGraph() {
            const labels = [];
            const originalData = [];
            const transformedData = [];
            const step = 0.1;

            const baseFunc = functions[baseType];
            
            const actualA = (params.reflectX ? -1 : 1) * params.a;
            const actualB = (params.reflectY ? -1 : 1) * params.b;

            for (let x = -10; x <= 10; x += step) {
                labels.push(x);
                originalData.push({ x: x, y: baseFunc(x) });
                
                // y = a * f(b(x + h)) + k
                const innerX = actualB * (x + params.h);
                let y = actualA * baseFunc(innerX) + params.k;
                
                transformedData.push({ x: x, y: y });
            }

            // Reference points calculation
            const originalScatter = [];
            const transformedScatter = [];

            refPointsX.forEach(refX => {
                const y0 = baseFunc(refX);
                originalScatter.push({ x: refX, y: y0 });

                if (actualB !== 0) {
                    const newX = (refX / actualB) - params.h;
                    const newY = actualA * y0 + params.k;
                    transformedScatter.push({ x: newX, y: newY });
                }
            });

            chartInstance.data.datasets[0].data = originalData;
            chartInstance.data.datasets[1].data = transformedData;
            chartInstance.data.datasets[2].data = originalScatter;
            chartInstance.data.datasets[3].data = transformedScatter;

            chartInstance.update();
            updateSummary();
            updateDynamicEquation();
            updatePointTable(actualA, actualB, baseFunc);
        }
        
        // Generate dynamic LaTeX equation based on current parameters
        function updateDynamicEquation() {
            if (typeof katex === 'undefined') return; // Wait for KaTeX to load

            // Format components carefully to avoid awkward math notation like "+ -3"
            const hStr = params.h < 0 ? `- ${Math.abs(params.h)}` : (params.h > 0 ? `+ ${params.h}` : '');
            const innerX = params.h === 0 ? 'x' : `(x ${hStr})`;
            
            const actualA = (params.reflectX ? -1 : 1) * params.a;
            const actualB = (params.reflectY ? -1 : 1) * params.b;
            
            let bStr = '';
            if (actualB === -1) bStr = '-';
            else if (actualB !== 1) bStr = actualB;
            
            let aStr = '';
            if (actualA === -1) aStr = '-';
            else if (actualA !== 1) aStr = actualA + ' \\cdot ';
            
            const kStr = params.k < 0 ? `- ${Math.abs(params.k)}` : (params.k > 0 ? `+ ${params.k}` : '');
            
            let latex = `y = ${aStr} f(${bStr}${innerX}) ${kStr}`;
            
            // Handle edge case where whole function is zeroed out by a=0
            if (params.a === 0) latex = `y = ${params.k}`; 

            try {
                katex.render(latex, document.getElementById('dynamicEquation'), {
                    throwOnError: false,
                    displayMode: true
                });
            } catch (e) {
                console.error("KaTeX rendering error:", e);
            }
        }

        // Generate coordinate mapping table for reference points
        function updatePointTable(actualA, actualB, baseFunc) {
            const tbody = document.getElementById('refPointsTableBody');
            if (!tbody) return;
            tbody.innerHTML = '';
            
            const formatNum = (num) => Number.isInteger(num) ? num.toString() : num.toFixed(2);
            
            refPointsX.forEach(refX => {
                const y0 = baseFunc(refX);
                let transStr = 'Undefined';
                let processStr = 'Undefined';
                
                if (actualB !== 0) {
                    const newX = (refX / actualB) - params.h;
                    const newY = actualA * y0 + params.k;
                    transStr = `(${formatNum(newX)}, ${formatNum(newY)})`;

                    // Build mapping process string for KaTeX
                    let xProc = '';
                    if (actualB === 1) {
                        xProc = formatNum(refX);
                    } else if (actualB === -1) {
                        xProc = `-${refX < 0 ? `(${formatNum(refX)})` : formatNum(refX)}`;
                    } else {
                        xProc = `\\frac{${formatNum(refX)}}{${formatNum(actualB)}}`;
                    }

                    if (params.h > 0) xProc += ` - ${formatNum(params.h)}`;
                    else if (params.h < 0) xProc += ` + ${formatNum(Math.abs(params.h))}`;

                    let yProc = '';
                    if (actualA === 1) {
                        yProc = formatNum(y0);
                    } else if (actualA === -1) {
                        yProc = `-${y0 < 0 ? `(${formatNum(y0)})` : formatNum(y0)}`;
                    } else {
                        yProc = `${formatNum(actualA)}(${formatNum(y0)})`;
                    }

                    if (params.k > 0) yProc += ` + ${formatNum(params.k)}`;
                    else if (params.k < 0) yProc += ` - ${formatNum(Math.abs(params.k))}`;

                    processStr = `\\left( ${xProc}, \\; ${yProc} \\right)`;
                }

                const tr = document.createElement('tr');
                tr.className = "border-b border-slate-100 hover:bg-slate-50";
                tr.innerHTML = `
                    <td class="px-3 py-3 font-mono text-slate-700 border-r border-slate-200 text-center">(${formatNum(refX)}, ${formatNum(y0)})</td>
                    <td class="px-3 py-3 text-slate-600 border-r border-slate-200 text-center">\\( ${processStr} \\)</td>
                    <td class="px-3 py-3 font-mono text-fuchsia-700 font-medium text-center">${transStr}</td>
                `;
                tbody.appendChild(tr);
            });

            // Re-render KaTeX math inside the newly generated table body
            if (typeof renderMathInElement !== 'undefined') {
                renderMathInElement(tbody, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '\\(', right: '\\)', display: false}
                    ]
                });
            }
        }

        // Generate transformation summary text based on parameters
        function updateSummary() {
            const list = document.getElementById('summaryList');
            list.innerHTML = '';
            
            let hasTransformations = false;

            // 1. Horizontal Translations (h)
            if (params.h > 0) {
                list.innerHTML += `<li>Leftward translation of <b>${params.h}</b> units</li>`;
                hasTransformations = true;
            } else if (params.h < 0) {
                list.innerHTML += `<li>Rightward translation of <b>${Math.abs(params.h)}</b> units</li>`;
                hasTransformations = true;
            }

            // 2. Horizontal Stretch/Compress & Reflection (b)
            if (params.reflectY) {
                list.innerHTML += `<li>Reflection with respect to the <b>y-axis</b></li>`;
                hasTransformations = true;
            }
            const absB = params.b;
            if (absB !== 1 && absB !== 0) {
                if (absB > 1) {
                    list.innerHTML += `<li>Reduction of <b>1/${absB.toFixed(2)}</b> times of the original along the x-axis (Horizontally compress)</li>`;
                } else if (absB < 1) {
                    list.innerHTML += `<li>Enlargement of <b>${(1/absB).toFixed(2)}</b> times of the original along the x-axis (Horizontally stretch)</li>`;
                }
                hasTransformations = true;
            }

            // 3. Vertical Stretch/Compress & Reflection (a)
            if (params.reflectX) {
                list.innerHTML += `<li>Reflection with respect to the <b>x-axis</b></li>`;
                hasTransformations = true;
            }
            const absA = params.a;
            if (absA !== 1 && absA !== 0) {
                if (absA > 1) {
                    list.innerHTML += `<li>Enlargement of <b>${absA}</b> times of the original along the y-axis (Vertically stretch)</li>`;
                } else if (absA < 1) {
                    list.innerHTML += `<li>Reduction of <b>${absA}</b> times of the original along the y-axis (Vertically compress)</li>`;
                }
                hasTransformations = true;
            }

            // 4. Vertical Translations (k)
            if (params.k > 0) {
                list.innerHTML += `<li>Upward translation of <b>${params.k}</b> units</li>`;
                hasTransformations = true;
            } else if (params.k < 0) {
                list.innerHTML += `<li>Downward translation of <b>${Math.abs(params.k)}</b> units</li>`;
                hasTransformations = true;
            }

            if (!hasTransformations) {
                list.innerHTML = '<li>No transformations applied. The functions match.</li>';
            }
        }

        // Event Listeners for UI
        function setupEventListeners() {
            const inputs = ['a', 'b', 'h', 'k'];
            
            inputs.forEach(param => {
                const slider = document.getElementById(`slider-${param}`);
                const numInput = document.getElementById(`num-${param}`);

                const syncAndDraw = (val) => {
                    let numVal = parseFloat(val);
                    if (isNaN(numVal)) numVal = param === 'a' || param === 'b' ? 1 : 0;
                    
                    params[param] = numVal;
                    slider.value = numVal;
                    numInput.value = numVal;
                    updateGraph();
                };

                slider.addEventListener('input', (e) => syncAndDraw(e.target.value));
                numInput.addEventListener('input', (e) => syncAndDraw(e.target.value));
            });

            document.getElementById('check-reflect-x').addEventListener('change', (e) => {
                params.reflectX = e.target.checked;
                updateGraph();
            });

            document.getElementById('check-reflect-y').addEventListener('change', (e) => {
                params.reflectY = e.target.checked;
                updateGraph();
            });

            document.getElementById('baseFunction').addEventListener('change', (e) => {
                baseType = e.target.value;
                updateGraph();
            });

            document.getElementById('resetBtn').addEventListener('click', () => {
                document.getElementById('baseFunction').value = 'quadratic';
                baseType = 'quadratic';
                
                params = { a: 1, b: 1, h: 0, k: 0, reflectX: false, reflectY: false };
                
                document.getElementById('check-reflect-x').checked = false;
                document.getElementById('check-reflect-y').checked = false;

                ['a', 'b'].forEach(p => {
                    document.getElementById(`slider-${p}`).value = 1;
                    document.getElementById(`num-${p}`).value = 1;
                });
                ['h', 'k'].forEach(p => {
                    document.getElementById(`slider-${p}`).value = 0;
                    document.getElementById(`num-${p}`).value = 0;
                });
                
                updateGraph();
            });
        }

        // Initialize application on load
        window.onload = () => {
            initChart();
            setupEventListeners();
            
            // Allow KaTeX script to initialize completely before first dynamic render
            setTimeout(() => {
                updateDynamicEquation();
            }, 300);
        };
    </script>
</body>
</html>
